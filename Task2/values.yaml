prometheus:
  url: http://prometheus-kube-prometheus-prometheus
  port: 9090

rules:
  default: false
  custom:
    - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        as: "http_requests_per_second"
      metricsQuery: |
        sum(rate(http_requests_total{<<.LabelMatchers>>}[1m])) by (pod, namespace)