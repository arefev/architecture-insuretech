http {
    # 1. Создаём зону лимитирования (10 запросов в минуту)
    # zone=partner_limit:10m — выделяем память под состояние лимитера
    # rate=10r/m — разрешено 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # 2. Применяем лимит запроса на этот endpoint
            limit_req zone=partner_limit burst=1 nodelay;

            # 3. Проксируем трафик как раньше
            proxy_pass http://backend_servers;
        }

        # 4. Возврат 429 при превышении лимита
        error_page 429 = /too_many_requests;

        location = /too_many_requests {
            return 429 "Too Many Requests\n";
        }
    }
}